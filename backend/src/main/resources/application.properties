spring.application.name=Gramacare

# =====================================================
# MySQL Database Configuration
# =====================================================

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gramacare
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / Hibernate Configuration
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================
# SERVER
# =====================================================

server.port=8082

# =====================================================
# EMAIL / GMAIL SMTP
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Gmail account used to SEND registration notifications
spring.mail.username=chandrasekarsuru@gmail.com

# IMPORTANT:
# DO NOT put your GramaCare login password here.
# Put the Gmail APP PASSWORD here.
spring.mail.password=YOUR_GMAIL_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =====================================================
# GRAMACARE ADMIN EMAIL
# =====================================================

gramacare.admin.email=chandrasekarsuru@gmail.com